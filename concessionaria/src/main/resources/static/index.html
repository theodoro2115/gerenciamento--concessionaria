<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concessionária Manus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 Concessionária Manus</h1>
            <p>Sistema de Gerenciamento (POO Python + Web)</p>
        </header>

        <nav class="menu">
            <button onclick="showSection('cadastrar-veiculo')">1 - Cadastrar Veículo</button>
            <button onclick="showSection('cadastrar-cliente')">2 - Cadastrar Cliente</button>
            <button onclick="showSection('listar-veiculos'); loadVeiculos()">7 - Listar Veículos</button>
            <button onclick="showSection('listar-clientes'); loadClientes()">8 - Listar Clientes</button>
            <button onclick="showSection('realizar-venda'); loadVendaOptions()">9 - Realizar Venda</button>
            <button onclick="showSection('historico-vendas'); loadHistorico()">10 - Histórico</button>
        </nav>

        <main>
            
            <section id="cadastrar-veiculo" class="content-section">
                <h2>Cadastrar Veículo</h2>
                <form id="form-veiculo">
                    <input type="text" id="v-modelo" placeholder="Modelo" required>
                    <input type="text" id="v-fabricante" placeholder="Fabricante" required>
                    <input type="number" id="v-ano" placeholder="Ano (máx 2027)" required>
                    <select id="v-tipo">
                        <option value="carro">Carro</option>
                        <option value="moto">Moto</option>
                        <option value="utilitario">Utilitário</option>
                    </select>
                    <button type="submit">Salvar</button>
                </form>
            </section>

            
            <section id="cadastrar-cliente" class="content-section">
                <h2>Cadastrar Cliente</h2>
                <form id="form-cliente">
                    <input type="text" id="c-nome" placeholder="Nome" required>
                    <input type="text" id="c-contato" placeholder="Contato" required>
                    <input type="text" id="c-documento" placeholder="CPF (11) ou CNPJ" required>
                    <select id="c-tipo">
                        <option value="PF">Pessoa Física (CPF)</option>
                        <option value="PJ">Pessoa Jurídica (CNPJ)</option>
                    </select>
                    <button type="submit">Salvar</button>
                </form>
            </section>

        
            <section id="listar-veiculos" class="content-section">
                <h2>Veículos em Estoque</h2>
                <div id="lista-veiculos" class="list-container"></div>
            </section>

            
            <section id="listar-clientes" class="content-section">
                <h2>Nossos Clientes</h2>
                <div id="lista-clientes" class="list-container"></div>
            </section>

            
            <section id="realizar-venda" class="content-section">
                <h2>Realizar Venda</h2>
                <div class="venda-box">
                    <select id="select-veiculo"><option value="">Selecione o Veículo</option></select>
                    <select id="select-cliente"><option value="">Selecione o Cliente</option></select>
                    <button onclick="efetuarVenda()">Confirmar Venda</button>
                </div>
            </section>

    
            <section id="historico-vendas" class="content-section">
                <h2>Histórico de Vendas</h2>
                <table id="tabela-vendas">
                    <thead>
                        <tr>
                            <th>Veículo</th>
                            <th>Cliente</th>
                            <th>Data</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-vendas"></tbody>
                </table>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
